aid: vela
name: Vela
description: >-
  Vela is an AI scheduling assistant from Y Combinator's Winter 2026 batch that
  handles the ambiguity that breaks scheduling. Added to any email thread or
  messaging conversation, it negotiates on the user's behalf — reading context,
  proposing meeting times across timezones, following up with participants,
  detecting calendar conflicts, rescheduling, and sending invites once
  scheduling is finalized. It works across Gmail, Outlook, Slack, Teams,
  WhatsApp, SMS, and phone, and is used by enterprise recruiters coordinating
  thousands of multi-party interviews a week as well as executives who need
  white-glove coordination at scale.
